  <main id="main" class="page page-dark">
    <p class="page-kicker">Archive</p>
    <h1>Gallery</h1>
    <p class="page-lead">Photographs from STEM Society work at Karachi Grammar School.</p>
    <div class="gallery-grid" aria-label="Photograph gallery">
      <figure class="gallery-frame gallery-frame-lg">
        <img src="assets/images/event-rush.jpg" width="738" height="1600" alt="Students in lanyards rushing forward and cheering at an indoor event" loading="eager" decoding="async">
      </figure>
      <figure class="gallery-frame">
        <img src="assets/images/nsb-trophy.jpg" width="1215" height="1280" alt="Five students in school uniform posing with a trophy in front of an NSB Pakistan National Science Bowl backdrop" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery-frame">
        <img src="assets/images/science-fair-certificates.jpg" width="1200" height="1600" alt="Students holding Grand Winner certificates at the National Science and Engineering Fair Pakistan" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery-frame gallery-frame-wide">
        <img src="assets/images/award-ceremony.jpg" width="1039" height="720" alt="Students in school uniform on a stage as one receives a framed award" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery-frame">
        <img src="assets/images/kgso-blue-polos.jpg" width="720" height="742" alt="Five students in matching blue polo shirts and yellow lanyards posing on a red stage" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery-frame">
        <img src="assets/images/kgso-audience-collage.jpg" width="720" height="702" alt="Collage of students seated and smiling in an auditorium during a KGSO event" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery-frame">
        <img src="assets/images/kgso-teams-collage.jpg" width="720" height="702" alt="Collage of students outdoors and at desks during a KGSO competition day" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery-frame gallery-frame-wide">
        <img src="assets/images/formula-pakistan-award.jpg" width="720" height="610" alt="Students on stage with an official holding a trophy in front of a blue digital screen" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery-frame">
        <img src="assets/images/formula-pakistan-team.jpg" width="720" height="660" alt="Six students posing together on stage at Formula Pakistan with a trophy" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery-frame">
        <img src="assets/images/formula-pakistan-habib.jpg" width="720" height="670" alt="Five students in black shirts and yellow lanyards standing before a Formula Pakistan backdrop" loading="lazy" decoding="async">
      </figure>
      <figure class="gallery-frame gallery-frame-wide">
        <img src="assets/images/psifi-group.jpg" width="720" height="685" alt="Twelve students posing outdoors at night after a science olympiad" loading="lazy" decoding="async">
      </figure>
    </div>
